name: "PBI サブタスク"
description: "親PBIを達成するための具体的な作業。必ず親PBIを持つ。"
labels: ["subtask"]
body:
  - type: input
    id: parent-pbi
    attributes:
      label: 親PBI
      description: "親PBIの issue 番号をリンクする。"
      placeholder: "#123"
    validations:
      required: true
  - type: textarea
    id: overview
    attributes:
      label: 概要
      description: "このサブタスクで何をやるか。"
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: 実装方針（How）
      description: "大まかな実装方針（基本設計〜詳細設計）。どう実装するか・段取り。"
    validations:
      required: true
  - type: textarea
    id: parent-ac
    attributes:
      label: 満たす親PBIの受け入れ条件
      description: "親PBIのACを番号で参照する。本文はコピーしない（例: #123 のAC 1, 3）。"
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 依存関係
      description: "サブタスク間の依存を #番号 のリンクで書く。Blocked by=自分が待つ先行タスク、Blocks=自分を待つ後続タスク。無ければ空でよい。"
      value: |
        **Blocked by**（このタスクが待つ先行タスク）

        -

        **Blocks**（このタスクを待つ後続タスク）

        -
    validations:
      required: false
