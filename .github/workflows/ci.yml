name: ci
on:
  pull_request:
  push:
    branches: [main]

env:
  # CI では git hooks 不要（prepare スクリプトの husky を無効化）
  HUSKY: 0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
